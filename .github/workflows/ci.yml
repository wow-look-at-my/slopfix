name: CI

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  id-token: write
  contents: write
  actions: read
  checks: read
  deployments: write
  artifact-metadata: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # go-toolchain runs dats/ after the build, and dats needs a sandbox backend or the suites run on the runner itself.
      - name: Install the dats sandbox backend
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # The //go:generate approval lives in .go-toolchain-generate. It is red until the published gate reads that file, and until the gate's hash covers a dependency's directives: that is what moved this repo's value off 9a44cebfe1e2.
      - uses: wow-look-at-my/go-toolchain@master

      # The binary this run built, not the last one released, so a new rule gates this repository before it ships.
      - run: ./build/slopfix workflows .