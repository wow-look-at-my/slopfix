name: CI

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  id-token: write
  contents: write
  actions: read
  checks: read
  deployments: write
  artifact-metadata: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: wow-look-at-my/go-toolchain@master

      # Runs the action this repository publishes against the binary this run just built, not the last one it released.
      - uses: ./
        with:
          command: workflows
          binary: build/slopfmt