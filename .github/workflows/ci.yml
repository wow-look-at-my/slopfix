name: CI

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  id-token: write
  contents: write
  actions: read
  checks: read
  deployments: write
  artifact-metadata: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: wow-look-at-my/go-toolchain@master
        with:
          # Approves the //go:generate directives; editing one fails the build with the new value.
          generate: 961c60645297

      # The binary this run built, not the last one released, so a new rule gates this repository before it ships.
      - run: ./build/slopfix workflows .