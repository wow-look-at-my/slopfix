name: CI

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  id-token: write
  contents: write
  actions: read
  checks: read
  deployments: write
  artifact-metadata: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # go-toolchain runs dats/ after the build, and dats needs a sandbox backend or the suites run on the runner itself.
      - name: Install the dats sandbox backend
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: wow-look-at-my/go-toolchain@master
        with:
          # Approves the //go:generate directives; editing a single fails the build with the new value.
          generate: 165003bec91c

      - run: ./build/slopfix check .

