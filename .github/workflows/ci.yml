name: CI

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  id-token: write
  contents: write
  actions: read
  checks: read
  deployments: write
  artifact-metadata: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # go-toolchain runs dats/ after the build, and dats needs a sandbox backend or the suites run on the runner itself.
      - name: Install the dats sandbox backend
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: wow-look-at-my/go-toolchain@master
        with:
          # Approves the //go:generate directives; editing a single fails the build with the new value.
          generate: 165003bec91c

      - run: ./build/slopfix check .

      # The marketplace ships this binary inside its slopfix plugin, so each master publish asks cc-marketplace to package it.
      - if: github.ref == 'refs/heads/master'
        uses: wow-look-at-my/actions@secret-server#latest
      - name: Ship this build in the marketplace
        if: github.ref == 'refs/heads/master'
        uses: wow-look-at-my/actions@typescript#latest
        with:
          script: |
            const token = process.env.CC_MARKETPLACE_DISPATCH_TOKEN;
            if (!token) throw new Error('secret-server vended no CC_MARKETPLACE_DISPATCH_TOKEN to this repository, so cc-marketplace never ships this build. Add a token with actions:write on wow-look-at-my/cc-marketplace, and entitle wow-look-at-my/slopfix on refs/heads/master.');
            await getOctokit(token).rest.actions.createWorkflowDispatch({
              owner: 'wow-look-at-my', repo: 'cc-marketplace', workflow_id: 'release.yml', ref: 'master', inputs: { publish: 'true' },
            });
            core.info('dispatched cc-marketplace release.yml to ship this slopfix build');