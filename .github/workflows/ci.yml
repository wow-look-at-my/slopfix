name: CI

on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: gha_${{ github.repository }}_${{ github.workflow }}_${{ github.ref != 'refs/heads/master' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  id-token: write
  contents: write
  actions: read
  checks: read
  deployments: write
  artifact-metadata: write

jobs:
  build:
    runs-on: ${{ github.event.repository.visibility == 'public' && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # go-toolchain runs dats/ after the build, and dats needs a sandbox backend or the suites run on the runner itself.
      - name: Install the dats sandbox backend
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # The test suite type-checks each script-action script a repair writes with the real tsc.
      - name: Install the TypeScript compiler
        run: npm install -g typescript@latest
      # The published pipeline predates the release stamp its own build writes. Every binary it links is then unstamped, and dats/version.dats fails. Building the pipeline from the action's checkout is what the action itself does for allow-source-build. That pipeline stamps the release into what it links.
      - name: Read the secrets a private module fetch needs
        uses: wow-look-at-my/actions@secret-server#latest
      - name: Configure git for private repos
        if: env.PRIVATE_ORG_REPO_READ != ''
        run: git config --global url."https://${PRIVATE_ORG_REPO_READ}@github.com/wow-look-at-my/".insteadOf "https://github.com/wow-look-at-my/"
      - name: Build the pipeline from the action's checkout
        id: gotoolchain
        shell: bash
        run: |
          set -euo pipefail
          src="${{ runner.temp }}/go-toolchain-src"
          git clone -q --depth 1 --branch master https://github.com/wow-look-at-my/go-toolchain "$src"
          fork="${{ runner.temp }}/gosmopolitan-source-build"
          mkdir -p "$fork"
          curl -fsSL --compressed "https://dl.pazer.build/gosmopolitan?branch=master&os=linux&arch=amd64" | tar -xz -C "$fork"
          (cd "$src" && GOROOT="$fork/go" GOTOOLCHAIN=local GOTELEMETRY=off GOPROXY=direct GOSUMDB=off GONOSUMDB='*' GOFLAGS= CGO_ENABLED=0 \
            "$fork/go/bin/go" build -o "${{ runner.temp }}/go-toolchain" ./src)
          echo "binary=${{ runner.temp }}/go-toolchain" >> "$GITHUB_OUTPUT"
      - uses: wow-look-at-my/go-toolchain@master
        with:
          binary: ${{ steps.gotoolchain.outputs.binary }}
          # Approves the //go:generate directives; editing a single fails the build with the new value.
          generate: 165003bec91c
          # A cold cache takes go generate and vet past the default timeout.
          timeout: 30

      # The fork check reads the repository from the API, and an anonymous call shares the runner IP's rate limit.
      - run: ./build/slopfix check .
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # The ratchet judges this branch by the default branch's guarantee. It reads that branch's .github/ratchet, so a branch cannot change what judges it.
      - run: ./build/slopfix ratchet

      # Runs the action at the root, so a break in the action fails its own repository first.
      - uses: ./
        with:
          permission: contents

      # The marketplace ships this binary inside its slopfix plugin, so each master publish asks cc-marketplace to package it.
      - name: Ship this build in the marketplace
        if: github.ref == 'refs/heads/master'
        uses: wow-look-at-my/cc-marketplace/.github/actions/ship@master
        with:
          plugins: slopfix