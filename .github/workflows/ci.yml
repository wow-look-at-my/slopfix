name: CI

on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: gha_${{ github.repository }}_${{ github.workflow }}_${{ github.ref != 'refs/heads/master' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  id-token: write
  contents: write
  actions: read
  checks: read
  deployments: write
  artifact-metadata: write

jobs:
  build:
    runs-on: ${{ github.event.repository.visibility == 'public' && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # go-toolchain runs dats/ after the build, and dats needs a sandbox backend or the suites run on the runner itself.
      - name: Install the dats sandbox backend
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # The test suite type-checks each script-action script a repair writes with the real tsc.
      - name: Install the TypeScript compiler
        run: npm install -g typescript@latest
      # The published go-toolchain carries buildhost's release stamp after the embedded standard library's record. The go command reads that library from the file's last bytes, so the pipeline cannot run as the go command. Until a release carries the stamp ahead of the record, take the stamp out of the last bytes here.
      - name: Take a go-toolchain the generators can run
        id: gotoolchain
        uses: wow-look-at-my/actions@typescript#latest
        with:
          script: |
            const resp = await fetch("https://dl.pazer.build/go-toolchain?os=linux&arch=amd64");
            if (!resp.ok) throw new Error(`downloading go-toolchain: HTTP ${resp.status}`);
            let buf = Buffer.from(await resp.arrayBuffer());
            const magic = Buffer.from("BUILDHOST-STAMP1", "ascii");
            if (buf.length >= 84 && buf.subarray(buf.length - 16).equals(magic)) {
              const stamp = buf.length - 20 - buf.readUInt32BE(buf.length - 20);
              const record = buf.subarray(stamp - 64, stamp);
              if (record.subarray(0, 8).toString("ascii") === "GOSTDEMB") {
                buf = Buffer.concat([buf.subarray(0, stamp - 64), buf.subarray(stamp), record]);
                core.info("moved the release stamp ahead of the embedded standard library's record");
              }
            }
            const file = path.join(env.RUNNER_TEMP!, "go-toolchain-repaired", "go-toolchain");
            fs.mkdirSync(path.dirname(file), { recursive: true });
            fs.writeFileSync(file, buf, { mode: 0o755 });
            core.setOutput("binary", file);
      - uses: wow-look-at-my/go-toolchain@master
        with:
          binary: ${{ steps.gotoolchain.outputs.binary }}
          # Approves the //go:generate directives; editing a single fails the build with the new value.
          generate: 165003bec91c
          # A cold cache takes go generate and vet past the default timeout.
          timeout: 30

      # The fork check reads the repository from the API, and an anonymous call shares the runner IP's rate limit.
      - run: ./build/slopfix check .
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # The ratchet judges this branch by the default branch's guarantee. It reads that branch's .github/ratchet, so a branch cannot change what judges it.
      - run: ./build/slopfix ratchet

      # Runs the action at the root, so a break in the action fails its own repository first.
      - uses: ./
        with:
          permission: contents

      # The marketplace ships this binary inside its slopfix plugin, so each master publish asks cc-marketplace to package it.
      - name: Ship this build in the marketplace
        if: github.ref == 'refs/heads/master'
        uses: wow-look-at-my/cc-marketplace/.github/actions/ship@master
        with:
          plugins: slopfix