name: slopfix
description: Download slopfix and check the whole checkout with every rule, or answer whether this job holds a permission

# No input narrows the check: action_test.go fails the build on any input but these.
inputs:
  permission:
    description: >-
      A permission scope, such as id-token. When set, the action answers
      check workflow-permission for the running job instead of the check.
    required: false
    default: ''

  level:
    description: The level the permission must reach - none, read or write
    required: false
    default: write

outputs:
  stdout:
    description: What slopfix wrote on stdout, which is the JSON answer when permission is set
    value: ${{ steps.unix.outputs.stdout || steps.windows.outputs.stdout }}

runs:
  using: composite
  steps:
    - name: Download slopfix
      id: download
      uses: wow-look-at-my/buildhost/.github/actions/buildhost-download@master
      with:
        project: slopfix

    # A binfmt_misc handler on the MZ magic can refuse a direct exec of the APE, so Unix runs it through sh.
    - name: Run slopfix
      id: unix
      if: runner.os != 'Windows'
      shell: bash
      # check reads the repository from the API to tell whether it is a fork, and a private one needs the token.
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -- check .
        if [ -n "${{ inputs.permission }}" ]; then
          set -- check workflow-permission --json --permission "${{ inputs.permission }}" --level "${{ inputs.level }}"
        fi
        rc=0
        out=$(sh "${{ steps.download.outputs.path }}" "$@") || rc=$?
        printf '%s\n' "$out"
        { echo 'stdout<<SLOPFIX_STDOUT_END'; printf '%s\n' "$out"; echo 'SLOPFIX_STDOUT_END'; } >> "$GITHUB_OUTPUT"
        exit "$rc"

    # Windows has no binfmt handler and boots the APE through its PE header. sh there looks for a loader built for another host.
    - name: Run slopfix
      id: windows
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        $slopfixArgs = @('check', '.')
        if ('${{ inputs.permission }}' -ne '') {
          $slopfixArgs = @('check', 'workflow-permission', '--json', '--permission', '${{ inputs.permission }}', '--level', '${{ inputs.level }}')
        }
        $out = & "${{ steps.download.outputs.path }}" @slopfixArgs
        $rc = $LASTEXITCODE
        $out
        "stdout<<SLOPFIX_STDOUT_END" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
        $out | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
        "SLOPFIX_STDOUT_END" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
        exit $rc
