name: slopfix
description: Download slopfix and check the whole checkout with every rule

# No input narrows the check: action_test.go fails the build on any input.

runs:
  using: composite
  steps:
    # The check reads the same tree in every job, so one job of the run does it.
    - name: Claim the slopfix check for this run
      id: claim
      uses: wow-look-at-my/actions@run-once#latest
      with:
        name: slopfix-check

    - name: Download slopfix
      id: download
      if: steps.claim.outputs.first != 'false'
      uses: wow-look-at-my/buildhost/.github/actions/buildhost-download@master
      with:
        project: slopfix

    # check reads the repository from the API to tell whether it is a fork, and a private one needs the token. A binfmt handler on an ubuntu runner refuses a direct exec of the APE, so Unix runs it through sh.
    - name: Run slopfix
      id: check
      if: steps.claim.outputs.first != 'false'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        if [ "$RUNNER_OS" = Windows ]; then exec "${{ steps.download.outputs.path }}" check .; fi
        exec sh "${{ steps.download.outputs.path }}" check .
