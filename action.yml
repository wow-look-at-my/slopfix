name: slopfix
description: Run slopfix against this repository, and fail the job when a rule rejects something

inputs:
  paths:
    description: 'Paths to read, space separated. A directory is walked.'
    required: false
    default: '.'

  only:
    description: >-
      Restrict the run to these rules, comma separated. An entry is a
      category or a category/rule.
    required: false
    default: ''

runs:
  using: composite
  steps:
    # The action runs check and never fix. A job that repairs its own checkout and then reports a pass enforces nothing.
    - name: Download slopfix
      id: download
      uses: wow-look-at-my/buildhost/.github/actions/buildhost-download@master
      with:
        project: slopfix

    # slopfix fails when a walk selects no file, so a step placed ahead of the checkout fails rather than passing on an empty workspace.
    - name: Run slopfix, through sh where a binfmt_misc handler on the MZ magic refuses a direct exec of the APE
      uses: wow-look-at-my/actions@multicmd#latest
      with:
        # The paths are a list, so they are deliberately unquoted.
        unix: >-
          sh "${{ steps.download.outputs.path }}" check
          ${{ inputs.only != '' && format('--only {0}', inputs.only) || '' }} ${{ inputs.paths }}
        # Windows registers no handler and boots the APE through its PE header, and sh there reads the shell bootstrap and looks for a loader built for another host.
        windows: >-
          & "${{ steps.download.outputs.path }}" check
          ${{ inputs.only != '' && format('--only {0}', inputs.only) || '' }} ${{ inputs.paths }}
